<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 610" width="860" font-family="Helvetica, Arial, 'Hiragino Sans', sans-serif" color="#1b2430"><rect width="860" height="610" fill="#ffffff"/><g fill="#1b2430"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><polygon points="0,0 10,5 0,10" fill="#1b2430"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="#1b2430"/></marker></defs><rect x="40" y="16" width="180" height="30" rx="3" fill="#e8eef6" stroke="#1b2430" stroke-width="1.2"/><text x="130" y="36" text-anchor="middle" font-size="12" font-weight="600">Client (python)</text><line x1="130" y1="46" x2="130" y2="596" stroke="#1b2430" stroke-dasharray="2 4" opacity=".5"/><rect x="340" y="16" width="180" height="30" rx="3" fill="#e8eef6" stroke="#1b2430" stroke-width="1.2"/><text x="430" y="36" text-anchor="middle" font-size="12" font-weight="600">Client thread (server)</text><line x1="430" y1="46" x2="430" y2="596" stroke="#1b2430" stroke-dasharray="2 4" opacity=".5"/><rect x="640" y="16" width="180" height="30" rx="3" fill="#e8eef6" stroke="#1b2430" stroke-width="1.2"/><text x="730" y="36" text-anchor="middle" font-size="12" font-weight="600">main thread (server)</text><line x1="730" y1="46" x2="730" y2="596" stroke="#1b2430" stroke-dasharray="2 4" opacity=".5"/><line x1="20" y1="70" x2="840" y2="70" stroke="#1b2430" opacity=".35"/><text x="26" y="64" text-anchor="start" font-size="11" font-weight="600">① ロビー</text><line x1="130" y1="100" x2="430" y2="100" stroke="#1b2430" stroke-width="1.2" marker-end="url(#a)"/><text x="280" y="92" text-anchor="middle" font-size="11" font-weight="400">connect + send(ユーザー名)</text><text x="436" y="124" text-anchor="start" font-size="11" font-weight="400">Player 生成 / name 保存</text><line x1="20" y1="160" x2="840" y2="160" stroke="#1b2430" opacity=".35"/><text x="26" y="154" text-anchor="start" font-size="11" font-weight="600">② 開始  (&#x27;g&#x27; かつ 接続 ≥2)</text><text x="736" y="186" text-anchor="end" font-size="11" font-weight="400">map_size = 4*ceil(√n) − 1</text><text x="736" y="202" text-anchor="end" font-size="11" font-weight="400">make_map(), 初期位置 (1,1) から 4 マス刻み</text><line x1="430" y1="222" x2="130" y2="222" stroke="#1b2430" stroke-width="1.2" marker-end="url(#a)"/><text x="280" y="214" text-anchor="middle" font-size="11" font-weight="400">4B: x, y, W, H</text><text x="436" y="240" text-anchor="start" font-size="11" font-weight="400">以降の新規接続は reject</text><line x1="20" y1="268" x2="840" y2="268" stroke="#1b2430" opacity=".35"/><text x="26" y="262" text-anchor="start" font-size="11" font-weight="600">③ ゲーム中  (client 主導のリクエスト/レスポンス)</text><line x1="130" y1="298" x2="430" y2="298" stroke="#1b2430" stroke-width="1.2" marker-end="url(#a)"/><text x="280" y="290" text-anchor="middle" font-size="11" font-weight="400">3B: x, y, bomb</text><line x1="430" y1="330" x2="130" y2="330" stroke="#1b2430" stroke-width="1.2" marker-end="url(#a)"/><text x="280" y="322" text-anchor="middle" font-size="11" font-weight="400">W*H+1 B: state + map</text><text x="436" y="352" text-anchor="start" font-size="11" font-weight="400">moveTo(x,y) / bomb なら createBomb()</text><line x1="730" y1="380" x2="430" y2="380" stroke="#1b2430" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="580" y="372" text-anchor="middle" font-size="11" font-weight="400">1 tick ごとに send_data 更新</text><text x="136" y="400" text-anchor="start" font-size="11" font-weight="400">表示 → 次のキー入力 → 繰り返し (state==0 生存, 1 死亡中, 2 死亡)</text><line x1="20" y1="430" x2="840" y2="430" stroke="#1b2430" opacity=".35"/><text x="26" y="424" text-anchor="start" font-size="11" font-weight="600">④ 終了  (生存者 ≤1 または &#x27;q&#x27;)</text><text x="736" y="456" text-anchor="end" font-size="11" font-weight="400">sleep(1) → onReceive を &#x27;\n&#x27; 返信に差替え</text><line x1="430" y1="478" x2="130" y2="478" stroke="#1b2430" stroke-width="1.2" marker-end="url(#a)"/><text x="280" y="470" text-anchor="middle" font-size="11" font-weight="400">1B: 0x0A  (state==&#x27;\n&#x27; で終了判定)</text><text x="736" y="508" text-anchor="end" font-size="11" font-weight="400">sleep(2) → 残り living を death へ → ランキング作成</text><line x1="730" y1="540" x2="130" y2="540" stroke="#1b2430" stroke-width="1.2" marker-end="url(#a)"/><text x="430" y="532" text-anchor="middle" font-size="11" font-weight="400">broadcast: UTF-8 ランキング文字列</text><text x="136" y="566" text-anchor="start" font-size="11" font-weight="400">curses 終了 → RANKING を print → close</text></g></svg>