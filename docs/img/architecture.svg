<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" font-family="Helvetica, Arial, 'Hiragino Sans', sans-serif" color="#1b2430"><rect width="860" height="470" fill="#ffffff"/><g fill="#1b2430"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><polygon points="0,0 10,5 0,10" fill="#1b2430"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="#1b2430"/></marker></defs><rect x="20" y="20" width="250" height="430" rx="4" fill="none" stroke="#1b2430" stroke-dasharray="2 4"/><text x="32" y="40" text-anchor="start" font-size="12" font-weight="600">client/A_client.py  (Python, 1 process / player)</text><rect x="40" y="60" width="210" height="70" rx="3" fill="none" stroke="#1b2430" stroke-width="1.2"/><text x="145.0" y="79" text-anchor="middle" font-size="13" font-weight="600">curses UI</text><text x="145.0" y="97" text-anchor="middle" font-size="11" font-weight="400">getch (10ms timeout)</text><text x="145.0" y="113" text-anchor="middle" font-size="11" font-weight="400">矢印キー / Space / q</text><rect x="40" y="160" width="210" height="70" rx="3" fill="none" stroke="#1b2430" stroke-width="1.2"/><text x="145.0" y="179" text-anchor="middle" font-size="13" font-weight="600">Local state</text><text x="145.0" y="197" text-anchor="middle" font-size="11" font-weight="400">x, y, map_data2</text><text x="145.0" y="213" text-anchor="middle" font-size="11" font-weight="400">衝突判定は client 側(0x30)</text><rect x="40" y="260" width="210" height="70" rx="3" fill="none" stroke="#1b2430" stroke-width="1.2"/><text x="145.0" y="279" text-anchor="middle" font-size="13" font-weight="600">socket (TCP)</text><text x="145.0" y="297" text-anchor="middle" font-size="11" font-weight="400">send 3B: x, y, bomb</text><text x="145.0" y="313" text-anchor="middle" font-size="11" font-weight="400">recv W*H+1 B: state + map</text><rect x="40" y="360" width="210" height="70" rx="3" fill="none" stroke="#1b2430" stroke-width="1.2"/><text x="145.0" y="379" text-anchor="middle" font-size="13" font-weight="600">Renderer</text><text x="145.0" y="397" text-anchor="middle" font-size="11" font-weight="400">bit → 敵/自/死/■/爆/炎</text><text x="145.0" y="413" text-anchor="middle" font-size="11" font-weight="400">state==0 → 自 / else YOU DIED</text><line x1="145" y1="130" x2="145" y2="160" stroke="#1b2430" stroke-width="1.2" marker-end="url(#a)"/><line x1="145" y1="230" x2="145" y2="260" stroke="#1b2430" stroke-width="1.2" marker-end="url(#a)"/><line x1="145" y1="330" x2="145" y2="360" stroke="#1b2430" stroke-width="1.2" marker-end="url(#a)"/><rect x="330" y="20" width="510" height="430" rx="4" fill="none" stroke="#1b2430" stroke-dasharray="2 4"/><text x="342" y="40" text-anchor="start" font-size="12" font-weight="600">server/A_server  (C++11, ncurses, 1 process)</text><rect x="350" y="60" width="230" height="86" rx="3" fill="#e8eef6" stroke="#1b2430" stroke-width="1.2"/><text x="465.0" y="79" text-anchor="middle" font-size="13" font-weight="600">main thread</text><text x="465.0" y="97" text-anchor="middle" font-size="11" font-weight="400">ロビー: &#x27;g&#x27; 開始 / &#x27;q&#x27; 強制終了</text><text x="465.0" y="113" text-anchor="middle" font-size="11" font-weight="400">ゲームループ ≈10 tick/s</text><text x="465.0" y="129" text-anchor="middle" font-size="11" font-weight="400">(getch halfdelay 100ms)</text><rect x="350" y="176" width="230" height="70" rx="3" fill="none" stroke="#1b2430" stroke-width="1.2"/><text x="465.0" y="195" text-anchor="middle" font-size="13" font-weight="600">accept thread</text><text x="465.0" y="213" text-anchor="middle" font-size="11" font-weight="400">Server::waitClients() をループ</text><text x="465.0" y="229" text-anchor="middle" font-size="11" font-weight="400">Client を生成 → onConnect</text><rect x="350" y="276" width="230" height="70" rx="3" fill="none" stroke="#1b2430" stroke-width="1.2"/><text x="465.0" y="295" text-anchor="middle" font-size="13" font-weight="600">Client thread × N</text><text x="465.0" y="313" text-anchor="middle" font-size="11" font-weight="400">read() → onReceive(c, buf, len)</text><text x="465.0" y="329" text-anchor="middle" font-size="11" font-weight="400">(接続ごとに1スレッド)</text><rect x="610" y="60" width="210" height="86" rx="3" fill="none" stroke="#1b2430" stroke-width="1.2"/><text x="715.0" y="79" text-anchor="middle" font-size="13" font-weight="600">mutex mtx</text><text x="715.0" y="97" text-anchor="middle" font-size="11" font-weight="400">onConnect / onReceive / 1 tick</text><text x="715.0" y="113" text-anchor="middle" font-size="11" font-weight="400">を直列化</text><rect x="610" y="176" width="210" height="170" rx="3" fill="none" stroke="#1b2430" stroke-width="1.2"/><text x="715.0" y="195" text-anchor="middle" font-size="13" font-weight="600">SquareObject world</text><text x="715.0" y="213" text-anchor="middle" font-size="11" font-weight="400">object_list</text><text x="715.0" y="229" text-anchor="middle" font-size="11" font-weight="400">square_map (次) / square_map_p (前)</text><text x="715.0" y="245" text-anchor="middle" font-size="11" font-weight="400">Block / Bomb / Fire / Player</text><text x="715.0" y="261" text-anchor="middle" font-size="11" font-weight="400">tick ごとに run() → 属性bit加算</text><rect x="350" y="376" width="470" height="56" rx="3" fill="none" stroke="#1b2430" stroke-width="1.2"/><text x="585.0" y="395" text-anchor="middle" font-size="13" font-weight="600">Player::id_Player[socket] / living / death</text><text x="585.0" y="413" text-anchor="middle" font-size="11" font-weight="400">ランキング = death の逆順 (最後に死んだ人が 1位)</text><line x1="250" y1="295" x2="350" y2="311" stroke="#1b2430" stroke-width="1.2" marker-end="url(#a)" marker-start="url(#as)"/><text x="300" y="288" text-anchor="middle" font-size="11" font-weight="400">TCP :10001</text><line x1="580" y1="311" x2="610" y2="280" stroke="#1b2430" stroke-width="1.2" marker-end="url(#a)"/><line x1="580" y1="103" x2="610" y2="103" stroke="#1b2430" stroke-width="1.2" marker-end="url(#a)"/><line x1="465" y1="246" x2="465" y2="276" stroke="#1b2430" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#a)"/><line x1="465" y1="346" x2="465" y2="376" stroke="#1b2430" stroke-width="1.2" marker-end="url(#a)"/><line x1="715" y1="146" x2="715" y2="176" stroke="#1b2430" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="715" y="164" text-anchor="middle" font-size="11" font-weight="400">lock</text></g></svg>