<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" font-family="Helvetica, Arial, 'Hiragino Sans', sans-serif" color="#1b2430"><rect width="860" height="420" fill="#ffffff"/><g fill="#1b2430"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><polygon points="0,0 10,5 0,10" fill="#1b2430"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="#1b2430"/></marker></defs><text x="20" y="24" text-anchor="start" font-size="13" font-weight="600">マップ1マスのバイト (square_map[x][y] への OR 加算)</text><rect x="20" y="40" width="100" height="80" rx="3" fill="#e8eef6" stroke="#1b2430" stroke-width="1.2"/><text x="70" y="60" text-anchor="middle" font-size="13" font-weight="600">0x80</text><text x="70" y="80" text-anchor="middle" font-size="11" font-weight="400">PLAYER</text><text x="70" y="94" text-anchor="middle" font-size="11" font-weight="400">LIVING</text><text x="70" y="112" text-anchor="middle" font-size="11" font-weight="400">人 / 敵</text><rect x="124" y="40" width="100" height="80" rx="3" fill="#e8eef6" stroke="#1b2430" stroke-width="1.2"/><text x="174" y="60" text-anchor="middle" font-size="13" font-weight="600">0x40</text><text x="174" y="80" text-anchor="middle" font-size="11" font-weight="400">PLAYER</text><text x="174" y="94" text-anchor="middle" font-size="11" font-weight="400">DYING</text><text x="174" y="112" text-anchor="middle" font-size="11" font-weight="400">死</text><rect x="228" y="40" width="100" height="80" rx="3" fill="#e8eef6" stroke="#1b2430" stroke-width="1.2"/><text x="278" y="60" text-anchor="middle" font-size="13" font-weight="600">0x20</text><text x="278" y="80" text-anchor="middle" font-size="11" font-weight="400">BLOCK</text><text x="278" y="112" text-anchor="middle" font-size="11" font-weight="400">壁</text><rect x="332" y="40" width="100" height="80" rx="3" fill="#e8eef6" stroke="#1b2430" stroke-width="1.2"/><text x="382" y="60" text-anchor="middle" font-size="13" font-weight="600">0x10</text><text x="382" y="80" text-anchor="middle" font-size="11" font-weight="400">BOMB</text><text x="382" y="112" text-anchor="middle" font-size="11" font-weight="400">爆*</text><rect x="436" y="40" width="100" height="80" rx="3" fill="#e8eef6" stroke="#1b2430" stroke-width="1.2"/><text x="486" y="60" text-anchor="middle" font-size="13" font-weight="600">0x08</text><text x="486" y="80" text-anchor="middle" font-size="11" font-weight="400">FIRE</text><text x="486" y="112" text-anchor="middle" font-size="11" font-weight="400">炎</text><rect x="540" y="40" width="100" height="80" rx="3" fill="none" stroke="#1b2430" stroke-width="1.2"/><text x="590" y="60" text-anchor="middle" font-size="13" font-weight="600">0x04</text><text x="590" y="80" text-anchor="middle" font-size="11" font-weight="400">THREAT</text><text x="590" y="112" text-anchor="middle" font-size="11" font-weight="400">(未使用)</text><rect x="644" y="40" width="100" height="80" rx="3" fill="none" stroke="#1b2430" stroke-width="1.2" opacity=".4"/><text x="694" y="60" text-anchor="middle" font-size="13" font-weight="600">0x02</text><text x="694" y="80" text-anchor="middle" font-size="11" font-weight="400">—</text><text x="694" y="112" text-anchor="middle" font-size="11" font-weight="400"></text><rect x="748" y="40" width="100" height="80" rx="3" fill="none" stroke="#1b2430" stroke-width="1.2" opacity=".4"/><text x="798" y="60" text-anchor="middle" font-size="13" font-weight="600">0x01</text><text x="798" y="80" text-anchor="middle" font-size="11" font-weight="400">—</text><text x="798" y="112" text-anchor="middle" font-size="11" font-weight="400"></text><text x="20" y="146" text-anchor="start" font-size="11" font-weight="400">クライアントは上位ビットから順に判定(0x80 → 0x40 → 0x20 → 0x10 → 0x08)。送信順は y 行 → x 列。</text><text x="20" y="190" text-anchor="start" font-size="13" font-weight="600">オブジェクト (SquareObject を継承, tick ごとに run() が bool=削除要求 を返す)</text><rect x="330" y="206" width="200" height="52" rx="3" fill="#e8eef6" stroke="#1b2430" stroke-width="1.2"/><text x="430.0" y="225" text-anchor="middle" font-size="13" font-weight="600">SquareObject</text><text x="430.0" y="243" text-anchor="middle" font-size="11" font-weight="400">x, y / object_list / run() 純粋仮想</text><rect x="20" y="306" width="190" height="70" rx="3" fill="none" stroke="#1b2430" stroke-width="1.2"/><text x="115.0" y="325" text-anchor="middle" font-size="13" font-weight="600">Block</text><text x="115.0" y="343" text-anchor="middle" font-size="11" font-weight="400">BLOCK_ATTR を立てる</text><text x="115.0" y="359" text-anchor="middle" font-size="11" font-weight="400">外周 + (偶,偶) の柱</text><line x1="430" y1="258" x2="115" y2="306" stroke="#1b2430" stroke-width="1.2" marker-end="url(#a)"/><rect x="230" y="306" width="190" height="70" rx="3" fill="none" stroke="#1b2430" stroke-width="1.2"/><text x="325.0" y="325" text-anchor="middle" font-size="13" font-weight="600">Bomb</text><text x="325.0" y="343" text-anchor="middle" font-size="11" font-weight="400">2s 後に爆発→Fire 生成</text><text x="325.0" y="359" text-anchor="middle" font-size="11" font-weight="400">火が当たると即誘爆</text><line x1="430" y1="258" x2="325" y2="306" stroke="#1b2430" stroke-width="1.2" marker-end="url(#a)"/><rect x="440" y="306" width="190" height="70" rx="3" fill="none" stroke="#1b2430" stroke-width="1.2"/><text x="535.0" y="325" text-anchor="middle" font-size="13" font-weight="600">Fire</text><text x="535.0" y="343" text-anchor="middle" font-size="11" font-weight="400">1s 間 十字に FIRE_ATTR</text><text x="535.0" y="359" text-anchor="middle" font-size="11" font-weight="400">Block で止まる 各方向3マス</text><line x1="430" y1="258" x2="535" y2="306" stroke="#1b2430" stroke-width="1.2" marker-end="url(#a)"/><rect x="650" y="306" width="190" height="70" rx="3" fill="none" stroke="#1b2430" stroke-width="1.2"/><text x="745.0" y="325" text-anchor="middle" font-size="13" font-weight="600">Player</text><text x="745.0" y="343" text-anchor="middle" font-size="11" font-weight="400">生存→(1s)死亡中→死亡</text><text x="745.0" y="359" text-anchor="middle" font-size="11" font-weight="400">前tickの BLOCK/FIRE で死</text><line x1="430" y1="258" x2="745" y2="306" stroke="#1b2430" stroke-width="1.2" marker-end="url(#a)"/><text x="20" y="408" text-anchor="start" font-size="11" font-weight="400">Player は前 tick のマップ(square_map_p)を参照して判定し、今 tick の属性は square_map に加算する(2面ダブルバッファ)。</text></g></svg>